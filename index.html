<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Food Diary</title>
  <meta name="description" content="A simple food and weight diary. Your diary stays on your phone.">
  <meta name="theme-color" content="#f7f5ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111513" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Food Diary">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Each screen is drawn into #app by app.js -->
  <main id="app"></main>

  <nav class="tabbar" aria-label="Main sections" hidden>
    <button type="button" data-act="tab" data-to="today">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg>
      <span>Today</span>
    </button>
    <button type="button" data-act="tab" data-to="progress">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-8M12 20V5M19 20v-5"/></svg>
      <span>My progress</span>
    </button>
    <button type="button" data-act="tab" data-to="more">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      <span>More</span>
    </button>
  </nav>

  <div id="error-box" class="error-box" role="alert" hidden>
    <span id="error-text" class="notice-text"></span>
    <button type="button" class="btn-small" id="error-close">Close</button>
  </div>

  <input type="file" id="import-file" accept=".json,application/json" class="visually-hidden" tabindex="-1" aria-hidden="true">

  <dialog id="confirm-dialog">
    <h2 id="confirm-title"></h2>
    <p id="confirm-text"></p>
    <div class="dialog-actions">
      <button type="button" class="btn-primary" id="confirm-yes">Yes</button>
      <button type="button" class="btn-secondary center" id="confirm-no">No, go back</button>
    </div>
  </dialog>

  <dialog id="share-dialog">
    <h2>Your copy is ready</h2>
    <p>Tap <b>Save</b>, then choose <b>Save to Files</b>.</p>
    <div class="dialog-actions">
      <button type="button" class="btn-primary" id="share-dialog-go">Save</button>
      <button type="button" class="btn-secondary center" id="share-dialog-cancel">Cancel</button>
    </div>
  </dialog>

  <script src="db.js"></script>
  <script src="foods.js"></script>
  <script src="app.js"></script>
</body>
</html>
